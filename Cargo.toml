[workspace]
members = ["loob-cli", "loob-core", "loob-optim", "loob-yt"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tasercake/smoothify"

[workspace.dependencies]
loob-core = { path = "loob-core" }
loob-optim = { path = "loob-optim" }
loob-yt = { path = "loob-yt" }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ndarray = "0.16"
