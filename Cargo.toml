[workspace]
members = ["loob-cli", "loob-core", "loob-optim", "loob-yt"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
loob-core = { path = "loob-core" }
loob-optim = { path = "loob-optim" }
loob-yt = { path = "loob-yt" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
ndarray = "0.16"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
